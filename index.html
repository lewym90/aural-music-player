<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aural">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Aural</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span>Aural</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" data-import="folder" aria-label="Importuj folder" title="Importuj folder">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <button class="btn-primary" data-import="files">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span id="importLabel">Importuj</span>
        </button>
      </div>
      <input type="file" id="fileInput" accept="audio/*,.flac,.m4a,.mp3,.wav,.aac,.ogg,.opus" multiple hidden>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>
    </header>

    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="search" placeholder="Szukaj utworów, wykonawców..." autocomplete="off">
    </div>

    <div class="toolbar" id="toolbar" hidden>
      <div class="sort-row" id="sortRow">
        <label for="sortSelect">Sortuj:</label>
        <select id="sortSelect">
          <option value="date">Najnowsze na górze</option>
          <option value="name">Alfabetycznie A–Z</option>
        </select>
        <button class="btn-text" id="selectBtn">Wybierz</button>
      </div>
      <div class="select-bar" id="selectBar" hidden>
        <button class="btn-text" id="selCancel">Anuluj</button>
        <span id="selCount">Zaznaczono 0</span>
        <button class="btn-text" id="selAll">Wszystkie</button>
        <button class="btn-text danger" id="selDelete" disabled>Usuń</button>
      </div>
      <div class="summary" id="summary"></div>
    </div>

    <main class="library" id="library">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <h2>Twoja biblioteka jest pusta</h2>
        <p>Zaimportuj pliki lub folder z muzyką z telefonu, aby rozpocząć słuchanie w najwyższej jakości.</p>
        <button class="btn-primary large" data-import="files">Wybierz pliki</button>
        <button class="btn-secondary" data-import="folder">Wybierz folder</button>
      </div>
      <ul class="track-list" id="trackList"></ul>
      <p class="no-results" id="noResults" hidden>Brak wyników</p>
      <p class="storage-info" id="storageInfo"></p>
    </main>

    <div class="player" id="player" hidden>
      <div class="now-playing" id="openFull" role="button" tabindex="0" aria-label="Otwórz odtwarzacz">
        <div class="artwork">
          <img class="cover-img" id="miniCover" alt="" hidden>
          <svg class="art-placeholder" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="meta">
          <div class="title" id="currentTitle">—</div>
          <div class="artist" id="currentArtist">Aural</div>
        </div>
        <svg class="chevron-up" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </div>

      <div class="progress-container">
        <span class="time js-cur">0:00</span>
        <input type="range" min="0" max="1000" step="1" value="0" class="progress js-progress" aria-label="Postęp">
        <span class="time js-dur">0:00</span>
      </div>

      <div class="controls">
        <button class="control-btn js-prev" aria-label="Poprzedni">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn play js-play" aria-label="Odtwarzaj">
          <svg class="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="pause-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="control-btn js-next" aria-label="Następny">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <section class="full-player" id="fullPlayer" hidden aria-label="Odtwarzacz">
      <div class="fp-top">
        <button class="control-btn" id="fpClose" aria-label="Zamknij odtwarzacz">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <span>Teraz odtwarzane</span>
        <span class="fp-spacer"></span>
      </div>
      <div class="fp-art">
        <img class="cover-img" id="fpCover" alt="" hidden>
        <svg class="art-placeholder" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="fp-meta">
        <div class="fp-title" id="fpTitle">—</div>
        <div class="fp-artist" id="fpArtist"></div>
        <div class="fp-album" id="fpAlbum"></div>
      </div>
      <div class="progress-container fp-progress">
        <span class="time js-cur">0:00</span>
        <input type="range" min="0" max="1000" step="1" value="0" class="progress js-progress" aria-label="Postęp">
        <span class="time js-dur">0:00</span>
      </div>
      <div class="controls fp-controls">
        <button class="control-btn js-prev" aria-label="Poprzedni">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn play js-play" aria-label="Odtwarzaj">
          <svg class="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="pause-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="control-btn js-next" aria-label="Następny">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata" playsinline></audio>
  <script src="js/tags.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
